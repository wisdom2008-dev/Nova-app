name: Build Nova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Prepare Buildozer Android SDK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -L \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/tools.zip

          unzip -q /tmp/tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_HOME/tools/bin/avdmanager"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-APK
          path: bin/*.apk
